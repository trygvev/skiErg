<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkiErg Intervals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a gym-floor tool, loud numbers, nothing else
   IDEA: the PM5's own monitor, blown up and shared between lanes
   PICTURE: the sticky phase banner (huge countdown) over one card per erg
   COLOUR and TYPE: work = hot red-orange, rest = cold blue, ground ink/paper; Barlow Condensed numerals
   LAYOUT: banner, then lanes, then session setup; stacks on phones */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f7,#0c0f13);--card:light-dark(#fff,#161b22);--ink:light-dark(#0c0f13,#eef1f5);--mute:light-dark(#5b6472,#8d97a6);--line:light-dark(#dde1e7,#262d38);--work:#ff4521;--rest:#1f6fff;--warm:#7a5cff;--ok:#18a058;--bad:#e5484d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.num,.ph-time,.pace,.mets b{font-family:"Barlow Condensed",Barlow,sans-serif;font-variant-numeric:tabular-nums}
.phase{position:sticky;top:0;z-index:5;padding:14px max(5vw,16px) 0;background:#2a313c;color:#fff;transition:background .3s}
.phase.work{background:var(--work)}.phase.rest{background:var(--rest)}.phase.warm,.phase.count{background:var(--warm)}.phase.done{background:var(--ok)}
.ph-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ph-label{font-size:22px;font-weight:600}
.ph-sub{font-size:15px;opacity:.85}
.ph-time{font-size:clamp(72px,22vw,150px);font-weight:800;line-height:1;margin:2px 0 10px}
.ph-bar{height:8px;margin:0 calc(-1*max(5vw,16px));background:rgba(0,0,0,.25)}.ph-bar i{display:block;height:100%;width:0;background:#fff}
main{padding:16px max(5vw,16px) 40px;max-width:1240px;margin:auto}
.ergs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.erg{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.erg.lead{border-color:var(--work)}
.eh{display:flex;align-items:center;gap:8px}
.nm{flex:1;font:600 18px Barlow,sans-serif;color:var(--ink);background:none;border:0;border-bottom:1px dashed var(--line);padding:4px 0}
.st{font-size:13px;color:var(--mute);white-space:nowrap;background:none;border:0;padding:6px}
.st::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--mute)}
.st.live::before{background:var(--ok)}.st.lost::before,.st.error::before{background:var(--bad)}.st.connecting::before{background:#f5a524}
.x{width:44px;height:44px;border:0;background:none;color:var(--mute);font-size:24px;cursor:pointer}
.big{display:flex;align-items:baseline;gap:6px}.pace{font-size:clamp(56px,16vw,84px);font-weight:800;line-height:1}.big small{color:var(--mute)}
.mets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.mets b{display:block;font-size:30px;font-weight:600;line-height:1.1}.mets small{color:var(--mute);font-size:13px}
.last{margin-top:8px;font-size:14px;color:var(--mute);min-height:21px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Barlow,sans-serif;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.danger{border-color:var(--bad);color:var(--bad)}.btn.ghost{background:none}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--rest);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
h2{margin:0 0 10px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mets b{font-size:26px}}
label{font-size:14px;color:var(--mute);display:grid;gap:4px}
input{font:600 18px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.presets button{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--ink);font:14px Barlow,sans-serif;cursor:pointer}
.hint{font-size:14px;color:var(--mute);margin:8px 0 0}
.warn{background:light-dark(#fff1ee,#2b1612);border:1px solid var(--work);border-radius:10px;padding:10px 12px;font-size:15px}
table{border-collapse:collapse;width:100%;margin:6px 0 16px;font-size:15px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:600}.scroll{overflow-x:auto}
h3{margin:10px 0 0;font-size:18px}
.loop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;margin-bottom:12px}
.track{display:block;width:100%;height:auto;max-height:240px}
.track .lane{fill:none;stroke:var(--line);stroke-width:11}
.track .sl{stroke:var(--ink);stroke-width:3}
.track .ttl{font:600 17px Barlow,sans-serif;fill:var(--ink);text-anchor:middle}
.track .sub{font:14px Barlow,sans-serif;fill:var(--mute);text-anchor:middle}
.dot{transition:transform .5s linear}
.dot text{font:800 12px "Barlow Condensed",sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.board{display:grid;gap:2px;margin-top:6px}
.br{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;min-height:32px}
.br .c{width:14px;height:14px;border-radius:50%}
.br .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br.me .n{font-weight:600}
.br .v{font:600 21px "Barlow Condensed",sans-serif;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.br .g{color:var(--mute);min-width:3.2em}
.gs{font-size:14px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;margin-top:12px}
@media(prefers-reduced-motion:reduce){.phase,.dot{transition:none}}
</style>
</head>
<body>
<header id="phase" class="phase">
  <div class="ph-top"><div class="ph-label" id="phLabel">Ready</div><div class="ph-sub" id="phSub"></div></div>
  <div class="ph-time" id="phTime">0:00</div>
  <div class="ph-bar"><i id="phBar"></i></div>
</header>
<main>
  <section class="loop" id="loop" hidden>
    <svg class="track" id="track" viewBox="0 0 400 200" role="img" aria-label="Skiers on the loop"></svg>
    <div class="board" id="board"></div>
    <div class="gs"></div>
  </section>
  <section id="ergs" class="ergs" aria-live="off"></section>
  <div class="row">
    <button id="addErg" class="btn primary">+ Connect SkiErg</button>
    <button id="addDemo" class="btn ghost">+ Demo erg</button>
  </div>
  <p id="warn" class="warn" hidden></p>
  <section class="panel" id="setup">
    <h2>Session</h2>
    <div class="grid">
      <label>Work<input id="work" value="1:00" inputmode="numeric"></label>
      <label>Rest<input id="rest" value="0:30" inputmode="numeric"></label>
      <label>Rounds<input id="reps" type="number" min="1" max="99" value="8"></label>
      <label>Warm-up<input id="warm" value="0:00" inputmode="numeric"></label>
    </div>
    <div class="grid2">
      <label>Group code (same on every phone)<input id="room" placeholder="e.g. skigjengen" autocapitalize="off" autocomplete="off" spellcheck="false"></label>
      <label>Loop (m)<input id="lap" type="number" min="20" max="2000" value="100"></label>
    </div>
    <div class="gs"></div>
    <div class="presets" id="presets">
      <button data-p="0:30,0:30,10">10 × 30/30</button>
      <button data-p="1:00,0:30,8">8 × 1:00/0:30</button>
      <button data-p="0:20,0:10,8">Tabata 8 × 20/10</button>
      <button data-p="4:00,2:00,4">4 × 4:00/2:00</button>
      <button data-p="2:00,1:00,6">6 × 2:00/1:00</button>
    </div>
    <div class="row">
      <button id="startNow" class="btn primary">Start in 10 s</button>
      <button id="startMin" class="btn">Start at <span id="minLbl" class="num">--:--</span></button>
    </div>
    <p class="hint">Several phones: enter the same group code on each phone and connect each phone to its own erg. Starting on one phone starts everyone, and all skiers show on the loop. Without internet, tap “Start at …” on every phone instead. One phone can also connect all three ergs.</p>
  </section>
  <div class="row" id="runRow" hidden><button id="stop" class="btn danger">Stop session</button></div>
  <section class="panel" id="results" hidden>
    <h2>Results</h2><div id="resBody"></div>
    <div class="row"><button id="copyRes" class="btn">Copy results</button><button id="newSess" class="btn ghost">New session</button></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const U=n=>`ce06${n}-43e5-11e4-916c-0800200c9a66`;
const S_DISC=U('0000'),S_INFO=U('0010'),S_CTRL=U('0020'),S_ROW=U('0030');
const C_GEN=U('0031'),C_ADD=U('0032'),C_RATE=U('0034'),C_STR=U('0036');
const ergs=[];let nid=1,session=null,audio=null,wake=null;
const PHONE=Math.random().toString(36).slice(2,8);

const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtPace=s=>{if(!s||!isFinite(s)||s>599)return '–:––';s=Math.round(s*10)/10;const m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(1).padStart(4,'0')};
const parseT=v=>{v=String(v).trim();if(v.includes(':')){const[a,b]=v.split(':');return(+a||0)*60+(+b||0)}return +v||0};
const watts=(t,d)=>d>5?2.8/((t/d)**3):0;
const warn=msg=>{$('warn').textContent=msg;$('warn').hidden=!msg};

/* settings */
const fields=['work','rest','reps','warm','lap'];
try{const s=JSON.parse(localStorage.getItem('skierg-cfg')||'null');if(s)fields.forEach(f=>{if(s[f]!=null)$(f).value=s[f]})}catch(_){}
const cfg=()=>{const c={work:parseT($('work').value),rest:parseT($('rest').value),reps:Math.max(1,Math.min(99,+$('reps').value||1)),warm:parseT($('warm').value)};
  try{localStorage.setItem('skierg-cfg',JSON.stringify(Object.fromEntries(fields.map(f=>[f,$(f).value]))))}catch(_){}return c};
const cfgText=c=>`${c.reps} × ${fmt(c.work)} / ${fmt(c.rest)}`+(c.warm?` · warm-up ${fmt(c.warm)}`:'');
$('presets').addEventListener('click',ev=>{const p=ev.target.dataset.p;if(!p)return;const[w,r,n]=p.split(',');$('work').value=w;$('rest').value=r;$('reps').value=n;idleHeader()});
fields.forEach(f=>$(f).addEventListener('input',idleHeader));

/* erg cards */
function addErg(o){
  const e=Object.assign({id:nid++,dist:null,raw:null,off:0,spm:0,hr:null,pace:0,w:0,last:0,iv:[],status:'connecting'},o);
  const a=document.createElement('article');a.className='erg';
  a.innerHTML=`<div class="eh"><input class="nm" aria-label="Name" value="${e.name}"><button class="st"></button><button class="x" aria-label="Remove">×</button></div>
  <div class="big"><span class="pace">–:––</span><small>/500 m</small></div>
  <div class="mets"><div><b class="w">–</b><small>watts</small></div><div><b class="spm">–</b><small>spm</small></div><div><b class="m">0</b><small class="ml">m total</small></div><div><b class="hr">–</b><small>bpm</small></div></div>
  <div class="last"></div>`;
  const q=s=>a.querySelector(s);
  e.el={a,pace:q('.pace'),w:q('.w'),spm:q('.spm'),m:q('.m'),ml:q('.ml'),hr:q('.hr'),last:q('.last'),st:q('.st'),nm:q('.nm')};
  e.el.nm.addEventListener('input',()=>{e.name=e.el.nm.value});
  q('.x').addEventListener('click',()=>removeErg(e));
  e.el.st.addEventListener('click',()=>{if(e.dev&&e.status!=='live'){e.retries=0;gattSetup(e)}});
  $('ergs').appendChild(a);ergs.push(e);setStatus(e,e.status);
  if(session&&!session.done){const p=session.ph[session.idx];if(p&&p.type==='work')enterWork(e,p)}
  return e;
}
function removeErg(e){
  e.removed=true;clearInterval(e.timer);
  try{e.dev&&e.dev.gatt.connected&&e.dev.gatt.disconnect()}catch(_){}
  e.el.a.remove();ergs.splice(ergs.indexOf(e),1);
}
function setStatus(e,s){e.status=s;const t={live:'Live',connecting:'Connecting…',lost:'Reconnecting… tap',error:'Error – tap to retry'}[s]||s;
  e.el.st.className='st '+s;e.el.st.textContent=e.demo?'Demo':t}

/* data in */
function setDist(e,raw){
  if(e.raw!=null&&raw<e.raw-1)e.off+=e.raw; // PM5 reset its counter
  e.raw=raw;e.dist=e.off+raw;e.last=Date.now();
  const iv=e.iv[e.iv.length-1];if(iv&&!iv.done&&iv.d0==null)iv.d0=e.dist;
}
function addAdd(e,spm,hr,pace){
  e.spm=spm;e.hr=hr;e.pace=pace;e.last=Date.now();
  const iv=e.iv[e.iv.length-1];
  if(iv&&!iv.done&&spm>0){iv.ss+=spm;iv.sn++;if(hr)iv.hr=Math.max(iv.hr,hr)}
}
const u24=(v,o)=>v.getUint8(o)|v.getUint8(o+1)<<8|v.getUint8(o+2)<<16;
const onGen=(e,v)=>{if(v.byteLength>=6)setDist(e,u24(v,3)/10)};
const onAdd=(e,v)=>{if(v.byteLength<9)return;const hr=v.getUint8(6);addAdd(e,v.getUint8(5),hr&&hr!==255?hr:null,v.getUint16(7,true)/100)};
const onStr=(e,v)=>{if(v.byteLength>=5){e.w=v.getUint16(3,true);e.last=Date.now()}};

/* bluetooth */
if(!navigator.bluetooth)warn('This browser has no Web Bluetooth. On Android use Chrome; on iPhone/iPad use the Bluefy browser. Demo ergs still work.');
$('addErg').addEventListener('click',async()=>{
  if(!navigator.bluetooth){warn('No Web Bluetooth here. Android: Chrome. iPhone/iPad: Bluefy.');return}
  let dev;
  try{dev=await navigator.bluetooth.requestDevice({filters:[{services:[S_DISC]},{namePrefix:'PM5'}],optionalServices:[S_ROW,S_INFO,S_CTRL]})}
  catch(err){if(err.name==='SecurityError')warn('Bluetooth is blocked in this embedded view. Open the page directly in Chrome or Bluefy.');else if(err.name!=='NotFoundError')warn('Bluetooth: '+err.message);return}
  if(ergs.some(x=>x.dev&&x.dev.id===dev.id)){warn('That erg is already connected.');return}
  warn('');
  const e=addErg({name:'Erg '+(ergs.length+1),dev});
  e.el.last.textContent=dev.name||'';
  dev.addEventListener('gattserverdisconnected',()=>{if(e.removed)return;setStatus(e,'lost');retry(e)});
  gattSetup(e);
});
async function gattSetup(e){
  setStatus(e,'connecting');
  try{
    const srv=await e.dev.gatt.connect();
    const row=await srv.getPrimaryService(S_ROW);
    try{await (await row.getCharacteristic(C_RATE)).writeValue(new Uint8Array([1]))}catch(_){} // 500 ms updates
    for(const[u,fn]of[[C_GEN,onGen],[C_ADD,onAdd],[C_STR,onStr]]){
      const c=await row.getCharacteristic(u);
      if(!c._sk){c._sk=1;c.addEventListener('characteristicvaluechanged',ev=>fn(e,ev.target.value))}
      await c.startNotifications(); // Android: one GATT op at a time
    }
    e.retries=0;setStatus(e,'live');
  }catch(err){if(e.removed)return;setStatus(e,'error');retry(e)}
}
function retry(e){e.retries=(e.retries||0)+1;if(e.retries<=6)setTimeout(()=>{if(!e.removed&&!e.dev.gatt.connected)gattSetup(e)},2000)}

/* demo erg */
$('addDemo').addEventListener('click',()=>{
  const e=addErg({name:'Demo '+(ergs.length+1),demo:true,status:'live'});
  const k=0.9+Math.random()*0.2;let raw=0;
  e.timer=setInterval(()=>{
    const p=session&&!session.done&&session.ph[session.idx],work=p&&p.type==='work';
    const pace=(work?118:215)*k+(Math.random()-.5)*6,sp=500/pace;
    raw+=sp*0.5;setDist(e,raw);addAdd(e,Math.round((work?40:22)+Math.random()*3),Math.round(work?165:130),pace);e.w=Math.round(2.8*sp**3);
  },500);
});

/* session */
function build(c,start,created){
  const ph=[];let t=start;const add=(type,dur,i)=>{if(dur>0){ph.push({type,dur,i,t0:t});t+=dur*1000}};
  add('warm',c.warm,0);for(let i=1;i<=c.reps;i++){add('work',c.work,i);if(i<c.reps)add('rest',c.rest,i)}
  return{c,ph,start,created,end:t,idx:-1,lastSec:null};
}
function begin(start,c=cfg(),sid=PHONE+'-'+start,bc=true){
  if(!c.work){warn('Set a work time.');return}
  initAudio();
  ergs.forEach(e=>{e.iv=[]});hist.clear();
  session=build(c,start,Date.now());session.sid=sid;
  if(bc)pub('c',{t:'start',start,c,sid});
  $('setup').hidden=true;$('results').hidden=true;$('runRow').hidden=false;lock();
}
$('startNow').addEventListener('click',()=>begin(Date.now()+10000));
const nextMin=()=>Math.ceil((Date.now()+20000)/60000)*60000;
$('startMin').addEventListener('click',()=>begin(nextMin()));
let stopArm=0;
function initAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(_){}}
document.addEventListener('pointerdown',initAudio);
$('stop').addEventListener('click',()=>{if(Date.now()-stopArm<3000){const sid=session&&session.sid;finish();pub('c',{t:'stop',sid});return}stopArm=Date.now();$('stop').textContent='Tap again to stop';setTimeout(()=>$('stop').textContent='Stop session',3000)});
$('newSess').addEventListener('click',()=>{session=null;$('results').hidden=true;$('setup').hidden=false;ergs.forEach(e=>{e.iv=[]});idleHeader()});

function enterWork(e,p){e.iv.push({i:p.i,d0:e.dist,ss:0,sn:0,hr:0,t0:p.t0,dur:p.dur})}
function exitWork(e,now){const iv=e.iv[e.iv.length-1];if(!iv||iv.done)return;iv.done=true;iv.t=Math.min(iv.dur,(now-iv.t0)/1000);iv.d=e.dist!=null&&iv.d0!=null?e.dist-iv.d0:0}
function change(from,to,now){
  for(let k=from;k<to;k++){
    if(k>=0&&session.ph[k].type==='work')ergs.forEach(e=>exitWork(e,session.ph[k].t0+session.ph[k].dur*1000));
    const n=session.ph[k+1];if(n&&n.type==='work')ergs.forEach(e=>enterWork(e,n));
  }
  session.idx=to;beep(to>=0&&session.ph[to].type==='work'?880:520,.6);try{navigator.vibrate&&navigator.vibrate(400)}catch(_){}
}
function finish(){
  if(!session||session.done)return;const now=Date.now();
  ergs.forEach(e=>exitWork(e,now));session.done=true;session.idx=-1;
  beep(990,1);$('runRow').hidden=true;$('stop').textContent='Stop session';
  showResults();release();setTimeout(()=>{if(session&&session.done)showResults()},1500); // late remote results
  const h=$('phase');h.className='phase done';$('phLabel').textContent='Done';$('phTime').textContent=fmt(0);$('phBar').style.width='100%';$('phSub').textContent=cfgText(session.c);
}
function beep(f,d){try{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d)}catch(_){}}
async function lock(){try{wake=await navigator.wakeLock.request('screen')}catch(_){}}
function release(){try{wake&&wake.release()}catch(_){}wake=null}
document.addEventListener('visibilitychange',()=>{if(session&&!session.done&&document.visibilityState==='visible')lock()});

/* render */
function idleHeader(){
  if(session)return;const c=cfg();
  $('phase').className='phase';$('phLabel').textContent='Ready';$('phSub').textContent=cfgText(c);
  $('phTime').textContent=fmt(c.warm+c.reps*c.work+(c.reps-1)*c.rest);$('phBar').style.width='0';
}
function tick(){
  const now=Date.now();
  const d=new Date(nextMin());$('minLbl').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  let p=null;
  if(session&&!session.done){
    if(now>=session.end){finish()}
    else{
      let idx=-1;if(now>=session.start)idx=session.ph.findIndex(x=>now<x.t0+x.dur*1000);
      if(idx!==session.idx)change(session.idx,idx,now);
      p=idx<0?{type:'count',t0:session.created,dur:(session.start-session.created)/1000}:session.ph[idx];
      const left=(p.t0+p.dur*1000-now)/1000,sec=Math.ceil(left);
      if(sec!==session.lastSec){session.lastSec=sec;if(sec>=1&&sec<=3)beep(660,.12)}
      const n=session.c.reps;
      $('phase').className='phase '+p.type;
      $('phLabel').textContent=p.type==='count'?'Starting in':p.type==='warm'?'Warm-up':p.type==='work'?`Work ${p.i}/${n}`:`Rest · next ${p.i+1}/${n}`;
      $('phSub').textContent=p.type==='count'?cfgText(session.c):`ends ${fmt((session.end-now)/1000)}`;
      $('phTime').textContent=fmt(left);
      $('phBar').style.width=Math.min(100,100*(1-left/p.dur))+'%';
    }
  }
  const work=p&&p.type==='work';let lead=null,best=-1;
  for(const e of ergs){
    const fresh=now-e.last<3000,iv=e.iv[e.iv.length-1];
    e.el.pace.textContent=fresh?fmtPace(e.pace):'–:––';
    e.el.w.textContent=fresh&&e.w?e.w:'–';
    e.el.spm.textContent=fresh&&e.spm?e.spm:'–';
    e.el.hr.textContent=fresh&&e.hr?e.hr:'–';
    if(work&&iv&&!iv.done){const m=e.dist!=null&&iv.d0!=null?e.dist-iv.d0:0;e.el.m.textContent=Math.round(m);e.el.ml.textContent='m this rep';if(m>best){best=m;lead=e}}
    else{e.el.m.textContent=e.dist!=null?Math.round(e.dist-(e.base??(e.base=e.dist))):0;e.el.ml.textContent='m total'}
    const dn=e.iv.filter(x=>x.done);const l=dn[dn.length-1];
    if(l)e.el.last.textContent=`Rep ${l.i}: ${Math.round(l.d)} m · ${fmtPace(l.d>5?l.t/(l.d/500):0)} · ${Math.round(watts(l.t,l.d))} W`;
  }
  ergs.forEach(e=>e.el.a.classList.toggle('lead',ergs.length>1&&e===lead&&best>0));
  renderLoop(p,now);
}
function rows(e){
  const dn=e.iv.filter(x=>x.done&&x.t>0);let D=0,T=0,S=0,N=0;
  const r=dn.map(x=>{D+=x.d;T+=x.t;S+=x.ss;N+=x.sn;return[x.i,Math.round(x.d),fmtPace(x.d>5?x.t/(x.d/500):0),Math.round(watts(x.t,x.d)),x.sn?Math.round(x.ss/x.sn):'–',x.hr||'–']});
  return{r,tot:['Total',Math.round(D),fmtPace(D>5?T/(D/500):0),Math.round(watts(T,D)),N?Math.round(S/N):'–','']};
}
function showResults(){
  const hd=['Rep','m','/500 m','W','spm','HR max'];
  $('resBody').innerHTML=ergs.map(e=>{const{r,tot}=rows(e);
    return `<h3></h3><div class="scroll"><table><thead><tr>${hd.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr>${tot.map(v=>`<td>${v}</td>`).join('')}</tr></tfoot></table></div>`}).join('')||'<p>No ergs connected.</p>';
  [...$('resBody').querySelectorAll('h3')].forEach((h,i)=>h.textContent=ergs[i].name);
  groupTable();
  $('results').hidden=false;
}
$('copyRes').addEventListener('click',async()=>{
  const d=new Date(),txt=[`SkiErg ${d.toLocaleDateString()} – ${cfgText(session?session.c:cfg())}`];
  ergs.forEach(e=>{const{r,tot}=rows(e);txt.push('',e.name,...r.map(x=>`#${x[0]}  ${x[1]} m  ${x[2]}  ${x[3]} W  ${x[4]} spm`),`Total ${tot[1]} m  ${tot[2]}  ${tot[3]} W`)});
  try{await navigator.clipboard.writeText(txt.join('\n'));$('copyRes').textContent='Copied'}catch(_){$('copyRes').textContent='Copy blocked'}
  setTimeout(()=>$('copyRes').textContent='Copy results',2000);
});
/* group sync over MQTT: every phone publishes its own skiers, everyone draws all of them */
const BASE='skierg-loop-v1';
const BROKER=new URLSearchParams(location.search).get('broker')||'wss://broker.emqx.io:8084/mqtt';
let cli=null,room='';const remote=new Map(),phones=new Map(),hist=new Map(),colors=new Map();
const PAL=['#ff4521','#1f6fff','#18a058','#f5a524','#b14cff','#00a7c4','#e0457b','#6b7a00'];
const col=id=>{if(!colors.has(id))colors.set(id,PAL[colors.size%PAL.length]);return colors.get(id)};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pub(k,o){if(cli&&cli.connected&&room)try{cli.publish(`${BASE}/${room}/${k}`,JSON.stringify(Object.assign({p:PHONE},o)))}catch(_){}}
function joinRoom(r){
  r=String(r||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);$('room').value=r;
  if(r===room&&(cli||!r))return;room=r;
  try{localStorage.setItem('skierg-room',r)}catch(_){}
  try{history.replaceState(null,'',location.pathname+location.search+(r?'#'+r:''))}catch(_){}
  if(cli){try{cli.end(true)}catch(_){}cli=null}
  remote.clear();phones.clear();
  if(!r||!window.mqtt)return;
  const c=mqtt.connect(BROKER,{clientId:'sk'+PHONE+Math.random().toString(36).slice(2,6),clean:true,connectTimeout:8000,reconnectPeriod:3000,keepalive:20});
  cli=c;
  c.on('connect',()=>c.subscribe(`${BASE}/${room}/#`));
  c.on('message',(t,b)=>{let m;try{m=JSON.parse(b.toString())}catch(_){return}if(!m||m.p===PHONE)return;onMsg(t.endsWith('/c')?'c':'s',m)});
}
function onMsg(k,m){
  const now=Date.now();
  if(k==='s'){phones.set(m.p,now);for(const s of m.k||[]){if(!s||!s.id)continue;s.at=now;remote.set(s.id,s);if(s.lr&&session&&s.sid===session.sid)keep(s.id,s.n,s.lr,s.ld)}}
  else if(m.t==='start'&&m.c&&(!session||session.done||session.sid!==m.sid)){
    if(build(m.c,m.start,now).end<=now)return;
    $('work').value=fmt(m.c.work);$('rest').value=fmt(m.c.rest);$('reps').value=m.c.reps;$('warm').value=fmt(m.c.warm||0);
    begin(m.start,m.c,m.sid,false);
  }
  else if(m.t==='stop'&&session&&!session.done&&session.sid===m.sid)finish();
}
function keep(id,n,r,d){if(d==null)return;const h=hist.get(id)||{n,r:{}};h.n=n;h.r[r]=d;hist.set(id,h)}
function snap(e){
  const now=Date.now(),iv=e.iv[e.iv.length-1],dn=e.iv.filter(x=>x.done),l=dn[dn.length-1];
  return{id:PHONE+'-'+e.id,n:e.name,d:iv&&!iv.done&&e.dist!=null&&iv.d0!=null?Math.round((e.dist-iv.d0)*10)/10:null,
    lr:l?l.i:0,ld:l?Math.round(l.d*10)/10:null,pace:now-e.last<3000?e.pace:0,sid:session?session.sid:null};
}
setInterval(()=>{if(ergs.length)pub('s',{k:ergs.map(snap)})},500);
$('room').addEventListener('change',()=>joinRoom($('room').value));
$('room').addEventListener('keydown',ev=>{if(ev.key==='Enter')$('room').blur()});

/* the loop */
const NS='http://www.w3.org/2000/svg',LANES=5,lanes=[],dots=new Map();
{
  const t=$('track');let h='';
  for(let k=0;k<LANES;k++){const i=k*12,T=24+i,B=176-i,r=76-i;h+=`<path class="lane" d="M200,${T} H290 A${r},${r} 0 0 1 290,${B} H110 A${r},${r} 0 0 1 110,${T} Z"/>`}
  h+=`<line class="sl" x1="200" y1="14" x2="200" y2="${24+(LANES-1)*12+10}"/><text class="ttl" x="200" y="100" id="lpT"></text><text class="sub" x="200" y="121" id="lpS"></text>`;
  t.innerHTML=h;t.querySelectorAll('.lane').forEach(p=>lanes.push({p,L:p.getTotalLength()}));
}
function renderLoop(p,now){
  const all=[...ergs.map(e=>Object.assign(snap(e),{me:1})),...[...remote.values()].filter(s=>now-s.at<5000)];
  [...phones].forEach(([k,t])=>{if(now-t>6000)phones.delete(k)});
  const gs=!room?'No group code: only skiers on this phone are shown.':!window.mqtt?'Group sync unavailable (could not load, check internet).':
    cli&&cli.connected?`Group “${room}” · ${phones.size+1} phone${phones.size?'s':''} connected`:`Connecting to group “${room}”…`;
  document.querySelectorAll('.gs').forEach(x=>x.textContent=gs);
  $('loop').hidden=all.length<2;if(all.length<2)return;
  const type=p?p.type:session&&session.done?'done':'idle',lap=Math.max(20,+$('lap').value||100);
  const R=Math.max(0,...all.map(s=>s.lr||0));let val,title;
  if(type==='work'){val=s=>s.d??0;title=`Rep ${p.i} · live`}
  else if((type==='rest'||type==='done')&&R){val=s=>s.lr===R?s.ld??0:0;title=`Rep ${R} result`}
  else{val=()=>0;title='On the start line'}
  const ord=[...all].sort((a,b)=>val(b)-val(a)),top=val(ord[0]);
  const work=session?session.c.work:0;
  $('lpT').textContent=title;$('lpS').textContent=top>0?`${Math.round(top)} m · lap ${Math.floor(top/lap)+1}`:`${lap} m loop`;
  $('board').innerHTML=ord.map((s,i)=>{const v=val(s),pc=type==='work'?s.pace:v>5&&work?work/(v/500):0;
    return `<div class="br${s.me?' me':''}"><i class="c" style="background:${col(s.id)}"></i><span class="n">${i+1}. ${esc(s.n)}</span><span class="v">${Math.round(v)} m</span><span class="g">${i&&top>0?'−'+Math.round(top-v)+' m':''}</span><span class="v">${fmtPace(pc)}</span></div>`}).join('');
  const ids=new Set(all.map(s=>s.id)),stable=[...all].sort((a,b)=>a.id<b.id?-1:1);
  for(const[id,g]of dots)if(!ids.has(id)){g.remove();dots.delete(id)}
  stable.forEach((s,k)=>{
    let g=dots.get(s.id);
    if(!g){g=document.createElementNS(NS,'g');g.setAttribute('class','dot');g.innerHTML=`<circle r="11" stroke="#fff" stroke-width="2"/><text></text>`;$('track').appendChild(g);dots.set(s.id,g)}
    g.firstChild.setAttribute('fill',col(s.id));g.lastChild.textContent=(s.n||'?').trim().charAt(0).toUpperCase();
    const ln=lanes[k%LANES],f=(val(s)%lap)/lap,pt=ln.p.getPointAtLength(f*ln.L);
    if(g._f!=null&&f<g._f-.5){g.style.transition='none';g.style.transform=`translate(${pt.x}px,${pt.y}px)`;g.getBoundingClientRect();g.style.transition=''}
    else g.style.transform=`translate(${pt.x}px,${pt.y}px)`;
    g._f=f;
  });
}
function groupTable(){
  ergs.forEach(e=>e.iv.filter(x=>x.done).forEach(x=>keep(PHONE+'-'+e.id,e.name,x.i,x.d)));
  if(hist.size<2||!session)return;
  const n=session.c.reps,list=[...hist.values()].map(h=>({n:h.n,r:h.r,t:Object.values(h.r).reduce((a,b)=>a+b,0)})).sort((a,b)=>b.t-a.t);
  const reps=[...Array(n)].map((_,i)=>i+1);
  $('resBody').insertAdjacentHTML('afterbegin',`<h3>Group · metres per rep</h3><div class="scroll"><table><thead><tr><th>Skier</th>${reps.map(r=>`<th>${r}</th>`).join('')}<th>Total</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(s.n)}</td>${reps.map(r=>`<td>${s.r[r]!=null?Math.round(s.r[r]):'–'}</td>`).join('')}<td>${Math.round(s.t)}</td></tr>`).join('')}</tbody></table></div>`);
}
{let r='';try{r=decodeURIComponent(location.hash.slice(1))||localStorage.getItem('skierg-room')||''}catch(_){}joinRoom(r)}
idleHeader();setInterval(tick,100);tick();
}
</script>
